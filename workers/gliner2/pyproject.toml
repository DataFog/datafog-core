[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "datafog-gliner2-worker"
version = "0.4.5b1"
description = "Optional offline GLiNER2 worker for DataFog Core model sessions"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "gliner2[local]==2.1.0",
  "transformers==5.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.12.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "peft==0.21.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers==4.57.6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "protobuf==6.33.6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy==1.26.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "peft==0.18.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.setuptools]
py-modules = ["datafog_gliner2_worker"]
