[package]
name = "fogvault-combined-memory-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
rust-version = "1.94.1"
[workspace]
[dependencies]
datafog-fogvault-native = { path = "../../../../integrations/fogvault-native" }
