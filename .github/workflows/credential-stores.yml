name: Native credential stores

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-credential-stores-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  credential-store:
    name: Credential store / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.94.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install isolated Secret Service prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring libglib2.0-bin
      - name: Prove qualification failure and cleanup guards
        run: python scripts/credential-qualification-selftest.py
      - name: Qualify real provider and preserve exact evidence
        if: runner.os != 'macOS'
        run: python scripts/credential-qualification-run.py --output target/credential-stores/report.json
      - name: Qualify isolated real Keychain on disposable hosted runner
        if: runner.os == 'macOS'
        run: python scripts/credential-qualification-run.py --disposable-macos-keychain --output target/credential-stores/report.json
      - name: Retain qualification reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: credential-store-${{ matrix.os }}
          retention-days: 7
          path: target/credential-stores/
          if-no-files-found: error
