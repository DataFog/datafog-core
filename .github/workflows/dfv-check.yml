name: Verification CLI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dfv-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
            if [[ -n "$files" ]]; then
              code=false
              while IFS= read -r file; do
                case "$file" in docs/*|*.md|*.mdx) ;; *) code=true ;; esac
              done <<< "$files"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - if: steps.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.scope.outputs.code == 'true'
        run: python3 -m pip install maturin
      - if: steps.scope.outputs.code == 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - if: steps.scope.outputs.code == 'true'
        run: npm ci --prefix bindings/wasm && npx --prefix bindings/wasm playwright install --with-deps chromium
      - if: steps.scope.outputs.code == 'true'
        run: cargo dfv build
      - if: steps.scope.outputs.code == 'true'
        run: cargo dfv doctor --json
      - if: steps.scope.outputs.code == 'true'
        run: cargo dfv check --json
      - if: steps.scope.outputs.code == 'true'
        run: cargo dfv parity --json
      - if: steps.scope.outputs.code == 'true'
        run: cargo dfv eval --json
      - if: steps.scope.outputs.code == 'true'
        run: cargo dfv smoke --json
      - if: steps.scope.outputs.code == 'true'
        run: cargo dfv parity --live --json
      - if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dfv-reports
          path: target/dfv/runs/
          retention-days: 30

  dfv-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.modified, 'crates/core/src/models/') ||
      contains(github.event.head_commit.modified, 'scripts/provision-') ||
      contains(github.event.head_commit.modified, 'scripts/model-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install provisioning tools
        run: python -m pip install 'huggingface_hub==1.27.0' 'psutil==7.2.2' maturin
      - name: Restore cached model assets
        uses: actions/cache/restore@v4
        id: model-assets
        with:
          path: |
            ${{ runner.temp }}/gliner2-download
          key: gliner2-model-${{ hashFiles('scripts/provision-gliner2-model.py', 'crates/core/src/models/gliner2-lock.json') }}
      - name: Download GLiNER2 files (if not cached)
        if: steps.model-assets.outputs.cache-hit != 'true'
        run: |
          hf download fastino/gliner2-privacy-filter-PII-multi \
            config.json encoder_config/config.json tokenizer.json tokenizer_config.json model.safetensors README.md \
            --revision 1cb4166094dc58fa8d836429f060d6c95f62b495 --local-dir "$RUNNER_TEMP/gliner2-download"
      - name: Cache GLiNER2 assets
        uses: actions/cache/save@v4
        if: steps.model-assets.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/gliner2-download
          key: ${{ steps.model-assets.outputs.cache-primary-key }}
      - run: cargo dfv build --sdk python
      - run: cargo dfv check --models --json
      - run: cargo dfv eval --models --json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfv-model-reports
          path: target/dfv/runs/
          retention-days: 30
