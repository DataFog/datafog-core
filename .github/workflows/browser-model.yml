name: Browser model

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spike/gliner2-browser/**"
      - "bindings/**"
      - "integrations/**"
      - "crates/**"
      - "scripts/**"
      - "fixtures/**"
      - "docs/contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - ".cargo/**"
      - ".github/workflows/browser-model.yml"
      - "examples/workspace-extension/**"
  push:
    branches: [main]
    paths:
      - "spike/gliner2-browser/**"
      - "bindings/**"
      - "integrations/**"
      - "crates/**"
      - "scripts/**"
      - "fixtures/**"
      - "docs/contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - ".cargo/**"
      - ".github/workflows/browser-model.yml"
      - "examples/workspace-extension/**"

permissions:
  contents: read

concurrency:
  group: browser-model-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spike/gliner2-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spike/gliner2-browser/package-lock.json
      - id: rust-version
        run: echo "version=$(../../scripts/pin.sh rust)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install wasm-bindgen-cli --version "$(../../scripts/pin.sh wasm-bindgen)" --locked
      - run: npm ci --prefix ../../bindings/wasm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install maturin==1.14.1
      - name: Build current Core SDK candidates for verifier prerequisites
        working-directory: .
        run: cargo dfv build
      - run: npm ci
      - run: npm run download-model
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm ci --prefix ../../examples/workspace-extension
      - name: Verify candidate tarball in an unpacked MV3 extension
        run: npm run test:model-extension --prefix ../../examples/workspace-extension
      - name: Qualify installed SDK contracts and approved-value recall
        working-directory: .
        run: cargo dfv check --core-sdk --json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-sdk-qualification
          path: |
            target/core-sdk-qualification/
            target/dfv/runs/
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-entities
          path: spike/gliner2-browser/results/entities.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv3-model-proof
          path: |
            examples/workspace-extension/output/playwright/**/report.json
            examples/workspace-extension/output/playwright/**/artifacts.json
            examples/workspace-extension/output/playwright/**/consumer/package-lock.json
            examples/workspace-extension/output/playwright/**/consumer/*.tgz
