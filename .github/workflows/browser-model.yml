name: Browser model

on:
  pull_request:
    paths:
      - "spike/gliner2-browser/**"
      - "bindings/wasm/**"
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/browser-model.yml"
  push:
    branches: [main]
    paths:
      - "spike/gliner2-browser/**"
      - "bindings/wasm/**"
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/browser-model.yml"

permissions:
  contents: read

concurrency:
  group: browser-model-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spike/gliner2-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: spike/gliner2-browser/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          WASM_BINDGEN_VERSION=$(grep -A2 '^name = "wasm-bindgen"$' ../../Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: npm ci --prefix ../../bindings/wasm
      - run: npm run build --prefix ../../bindings/wasm
      - run: npm ci
      - run: npm run download-model
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-entities
          path: spike/gliner2-browser/results/entities.json
