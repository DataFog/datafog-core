name: Publish WASM package

on:
  push:
    tags:
      - "wasm-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the package without publishing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish @datafog/wasm to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require exact-commit Core and FogVault qualification for v1+
        run: python3 scripts/check-fogvault-release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require passing model integration for this commit
        run: python3 scripts/check-model-integration.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 scripts/check-release.py wasm
      - id: rust-version
        run: echo "version=$(./scripts/pin.sh rust)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: cargo install wasm-bindgen-cli --version "$(./scripts/pin.sh wasm-bindgen)" --locked
      - run: npm ci --prefix bindings/wasm
      - run: npx --prefix bindings/wasm playwright install --with-deps chromium
      - run: npm run test:package --prefix bindings/wasm
      - name: Freeze the tested WASM package archive
        run: python3 scripts/stage-publication.py wasm
      - name: Check the exact archive without publishing
        working-directory: target/publication-wasm
        run: |
          sha256sum --check SHA256SUMS
          while IFS= read -r archive; do
            npm publish "$archive" --dry-run --ignore-scripts --access public --tag "$(cat npm-tag.txt)"
          done < publication-order.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-publication-inputs
          path: target/publication-wasm/
          if-no-files-found: error
      - name: Publish the retained archive
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: target/publication-wasm
        run: |
          sha256sum --check SHA256SUMS
          while IFS= read -r archive; do
            npm publish "$archive" --ignore-scripts --access public --tag "$(cat npm-tag.txt)"
          done < publication-order.txt
