name: Publish WASM package

on:
  push:
    tags:
      - "wasm-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the package without publishing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish @datafog/wasm to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require passing model integration for this commit
        run: python3 scripts/check-model-integration.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 scripts/check-release.py wasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: |
          WASM_BINDGEN_VERSION=$(grep -A2 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: npm ci --prefix bindings/wasm
      - run: npx --prefix bindings/wasm playwright install --with-deps chromium
      - run: npm run test:package --prefix bindings/wasm
      - run: npm publish --dry-run --ignore-scripts
        working-directory: bindings/wasm
      - run: npm publish
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: bindings/wasm
