name: Publish WASM package
on:
  push:
    tags:
      - "wasm-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify retained qualified artifacts without publishing
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release.py wasm
      - name: Require complete model qualification for this source
        id: qualified
        run: python3 scripts/check-model-qualification.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: wasm-model-candidate
          run-id: ${{ steps.qualified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - name: Inspect qualified npm archives
        run: node scripts/publish-npm-candidates.mjs candidate --dry-run
      - name: Publish qualified npm archives
        if: github.event_name == 'push' || !inputs.dry_run
        run: node scripts/publish-npm-candidates.mjs candidate
