name: WASM binding

on:
  # Tags are excluded: release tags point at commits already tested on a branch.
  push:
    branches: [main, "release/**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/core/**"
      - "bindings/wasm/**"
      - "fixtures/**"
      - "scripts/test-wasm-package.mjs"
      - "scripts/german-conformance.mjs"
      - "scripts/credential-overlap-conformance.mjs"
      - "scripts/uuid-conformance.mjs"
      - ".github/workflows/wasm-binding.yml"
      - "scripts/*-conformance.mjs"
      - "scripts/synthetic-fixtures.mjs"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/core/**"
      - "bindings/wasm/**"
      - "fixtures/**"
      - "scripts/test-wasm-package.mjs"
      - "scripts/german-conformance.mjs"
      - "scripts/credential-overlap-conformance.mjs"
      - "scripts/uuid-conformance.mjs"
      - ".github/workflows/wasm-binding.yml"
      - "scripts/*-conformance.mjs"
      - "scripts/synthetic-fixtures.mjs"

# Superseded pull request runs are cancelled. Pushes to main and release
# branches get their own group, so every pushed commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests reuse caches from main without adding their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: npm ci --prefix bindings/wasm
      - run: npx --prefix bindings/wasm playwright install --with-deps chromium
      - run: npm run test:package --prefix bindings/wasm
