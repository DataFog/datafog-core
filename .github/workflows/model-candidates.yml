name: Build model test packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            node_args: "--use-napi-cross"
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            node_args: "--use-napi-cross"
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            node_args: ""
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            node_args: ""
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            node_args: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: rust-version
        run: echo "version=$(./scripts/pin.sh rust)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: python -m pip install 'maturin>=1.9.4,<2.0'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --manifest-path bindings/python/Cargo.toml --out dist
      - run: npm ci --prefix bindings/node
      - run: npm run build --prefix bindings/node -- --target ${{ matrix.target }} ${{ matrix.node_args }}
      - name: Stage native candidates
        run: |
          mkdir -p candidate
          cp dist/*.whl bindings/node/*.node candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidates-${{ matrix.platform }}
          path: candidate/
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          name: candidate-node-wrapper
          path: |
            bindings/node/native.js
            bindings/node/index.d.ts
      - name: Build Rust test package
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p common
          cargo package -p datafog-core --locked --allow-dirty
          cp target/package/*.crate common/
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          name: common-model-candidates
          path: common/
  node:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: native-candidates-*
          path: candidates
      - uses: actions/download-artifact@v4
        with:
          name: candidate-node-wrapper
          path: bindings/node
      - run: npm ci --prefix bindings/node
      - name: Assemble and pack final npm artifacts
        working-directory: bindings/node
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir ../../candidates
          npx napi prepublish -t npm --no-gh-release --skip-optional-publish
          mkdir -p ../../node-candidates
          for package in npm/*; do
            (cd "$package" && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/node-candidates")
          done
          npm pack --ignore-scripts --pack-destination ../../node-candidates
      - uses: actions/upload-artifact@v4
        with:
          name: node-model-candidates
          path: node-candidates/
