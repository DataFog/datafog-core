name: Fuzz

on:
  workflow_dispatch:
  # Pull requests only build the targets. A fuzz run is nightly work.
  pull_request:
  schedule:
    # Nightly, off the top of the hour to avoid the busiest runner window.
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only changes skip the remaining steps but still report success, so
      # a required check never waits for a run that path filters would not start.
      - name: Detect docs-only changes
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          if [[ -n "$files" ]]; then
            code=false
            while IFS= read -r file; do
              case "$file" in docs/*|*.md|*.mdx) ;; *) code=true ;; esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@nightly
      - if: steps.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core/fuzz
      - if: steps.scope.outputs.code == 'true'
        name: Check formatting and build the fuzz targets
        run: |
          cargo +nightly fmt --manifest-path crates/core/fuzz/Cargo.toml -- --check
          cargo +nightly build --release --bins --manifest-path crates/core/fuzz/Cargo.toml

  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [workspace_snapshot, utf16_range]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz ${{ matrix.target }} for 60s
        # `-max_total_time` is the budget; libFuzzer exits non-zero with the crash
        # in `artifacts/<target>/`. Seeds are committed, so a fresh target starts
        # from real snapshots and range pairs.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/core/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
