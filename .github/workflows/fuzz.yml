name: Fuzz

on:
  workflow_dispatch:
  # Catch compile breaks in the targets or the decoder they reach without
  # spending fuzz time on every pull request.
  pull_request:
    paths:
      - "crates/core/fuzz/**"
      - "crates/core/src/**"
      - "crates/core/tests/**"
      - "crates/core/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Nightly, off the top of the hour to avoid the busiest runner window.
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core/fuzz
      - name: Check formatting and build the fuzz targets
        run: |
          cargo +nightly fmt --manifest-path crates/core/fuzz/Cargo.toml -- --check
          cargo +nightly build --release --bins --manifest-path crates/core/fuzz/Cargo.toml

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [workspace_snapshot, utf16_range]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for 60s
        # `-max_total_time` is the budget; libFuzzer exits non-zero with the crash
        # in `artifacts/<target>/`. Seeds are committed, so a fresh target starts
        # from real snapshots and range pairs.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/core/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
