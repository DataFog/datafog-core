name: Correct SQLite RC-only npm dist-tag

on:
  workflow_dispatch:

concurrency:
  group: sqlite-rc-dist-tag-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  remove-first-publication-latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - name: Remove only the new SQLite RC latest tag and verify next remains
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const packageName = '@datafog/core-sqlite-browser';
          const version = '1.1.0-rc.1';
          const endpoint = 'https://registry.npmjs.org/-/package/@datafog%2fcore-sqlite-browser/dist-tags';
          async function tags() {
            const response = await fetch(endpoint, {headers: {'Cache-Control': 'no-cache', Pragma: 'no-cache'}});
            if (!response.ok) throw new Error(`Canonical public dist-tags request failed: ${response.status}`);
            const result = await response.json();
            if (!result || Array.isArray(result) || typeof result !== 'object' ||
                Object.keys(result).some(name => name !== 'latest' && name !== 'next') || result.next !== version) {
              throw new Error('Unexpected SQLite dist-tags; refusing mutation');
            }
            return result;
          }
          async function main() {
            const before = await tags();
            console.log(JSON.stringify({package: packageName, before}));
            if (!Object.hasOwn(before, 'latest')) {
              console.log('No-op: latest is already absent and next is the release candidate.');
              return;
            }
            if (before.latest !== version) throw new Error('SQLite latest is not the fixed RC; refusing mutation');
            execFileSync('npm', ['dist-tag', 'rm', packageName, 'latest', '--registry=https://registry.npmjs.org/'], {stdio: 'inherit'});
            for (let attempt = 0; attempt < 12; attempt++) {
              const after = await tags();
              if (!Object.hasOwn(after, 'latest')) {
                console.log(JSON.stringify({package: packageName, after, verified: true}));
                return;
              }
              if (after.latest !== version) throw new Error('Unexpected latest after correction; refusing further action');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Canonical public dist-tags did not confirm latest removal');
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
