name: Publish Node package

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify packages without publishing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ec5b2ccf0bfa13db4f99060c1a9f01984cd179d
      - name: Require passing model integration for this commit
        run: GITHUB_SHA="$(git rev-parse HEAD)" python3 scripts/check-model-integration.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: npm whoami
      - run: npm ci --prefix bindings/node
      - uses: actions/download-artifact@v4
        with:
          run-id: 39347115103
          github-token: ${{ github.token }}
          pattern: bindings-*
          path: bindings/node/artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: 39347115103
          github-token: ${{ github.token }}
          name: node-wrapper
          path: bindings/node
      - name: Assemble platform packages
        working-directory: bindings/node
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          npx napi prepublish -t npm --no-gh-release --skip-optional-publish
      - name: Verify assembled package and native dependency
        working-directory: bindings/node
        run: npm run test:package -- --prebuilt --platform-package npm/linux-x64-gnu
      - name: Check all package contents without publishing
        working-directory: bindings/node
        run: |
          tag="$(node -p 'require("./package.json").publishConfig.tag || "latest"')"
          for package in npm/*; do
            (cd "$package" && npm publish --dry-run --ignore-scripts --tag "$tag")
          done
          npm publish --dry-run --ignore-scripts --tag "$tag"
      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: bindings/node
        run: |
          tag="$(node -p 'require("./package.json").publishConfig.tag || "latest"')"
          for package in npm/*; do
            (cd "$package" && npm publish --ignore-scripts --tag "$tag")
          done
          npm publish --ignore-scripts --tag "$tag"
