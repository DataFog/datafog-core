name: Publish Node package

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            build_args: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            build_args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_args: "--use-napi-cross"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build_args: "--use-napi-cross"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci --prefix bindings/node
      - run: npm run build --prefix bindings/node -- --target ${{ matrix.target }} ${{ matrix.build_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/datafog.*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci --prefix bindings/node
      - uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Assemble platform packages
        working-directory: bindings/node
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
      - name: Publish
        working-directory: bindings/node
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
