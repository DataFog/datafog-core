name: Publish Node package

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify packages without publishing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: datafog.darwin-arm64.node
            build_args: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: datafog.darwin-x64.node
            build_args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: datafog.linux-x64-gnu.node
            build_args: "--use-napi-cross"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: datafog.linux-arm64-gnu.node
            build_args: "--use-napi-cross"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: datafog.win32-x64-msvc.node
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release.py node
      - id: rust-version
        run: echo "version=$(./scripts/pin.sh rust)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci --prefix bindings/node
      - run: npm run build --prefix bindings/node -- --target ${{ matrix.target }} ${{ matrix.build_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/${{ matrix.binary }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: node-wrapper
          path: |
            bindings/node/native.js
            bindings/node/index.d.ts
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require exact-commit Core and FogVault qualification for v1+
        run: python3 scripts/check-fogvault-release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require passing model integration for this commit
        run: python3 scripts/check-model-integration.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: npm ci --prefix bindings/node
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: bindings/node/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: node-wrapper
          path: bindings/node
      - name: Assemble platform packages
        working-directory: bindings/node
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          npx napi prepublish -t npm --no-gh-release --skip-optional-publish
      - name: Verify assembled package and native dependency
        working-directory: bindings/node
        run: npm run test:package -- --prebuilt --platform-package npm/linux-x64-gnu
      - name: Freeze native platform archives and the root archive
        run: python3 scripts/stage-publication.py node
      - name: Check the exact archives without publishing
        working-directory: target/publication-node
        run: |
          sha256sum --check SHA256SUMS
          tag="$(cat npm-tag.txt)"
          while IFS= read -r archive; do
            npm publish "$archive" --dry-run --ignore-scripts --access public --tag "$tag"
          done < publication-order.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-publication-inputs
          path: target/publication-node/
          if-no-files-found: error
      - name: Publish the retained platform archives before the root archive
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: target/publication-node
        run: |
          sha256sum --check SHA256SUMS
          tag="$(cat npm-tag.txt)"
          while IFS= read -r archive; do
            npm publish "$archive" --ignore-scripts --access public --tag "$tag"
          done < publication-order.txt
