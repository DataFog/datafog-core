name: Observe Node no-op contention
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6c18c023fab49f30c1887a927afb0a4093886214
          path: candidate-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Build exact copied-buffer binding
        run: |
          npm ci --prefix candidate-source/bindings/node
          npm run build --prefix candidate-source/bindings/node
      - name: Record actual same-head no-op outcomes
        run: python scripts/diagnose-node-noop-contention.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-noop-contention
          path: noop-diagnosis
          if-no-files-found: error
