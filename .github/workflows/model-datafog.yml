name: Model integration

# Explicit integration checks only. Routine PR/push CI never downloads model assets.
# Cached files are reverified by the pinned provisioner before every installation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    uses: ./.github/workflows/model-candidates.yml
  installed-model:
    needs: candidates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Intel macOS checks are advisory: a failure is reported on the job but
    # does not fail the run, and publication does not require these jobs.
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        backend: [datafog, gliner2, gliner2-general]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            npm_platform: linux-x64-gnu
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            npm_platform: linux-arm64-gnu
          - os: macos-15
            platform: macos-arm64
            npm_platform: darwin-arm64
          - os: macos-15-intel
            platform: macos-x86_64
            npm_platform: darwin-x64
          - os: windows-latest
            platform: windows-x86_64
            npm_platform: win32-x64-msvc
    defaults:
      run:
        shell: bash
    env:
      DATAFOG_PLATFORM: ${{ matrix.platform }}
      MODEL_BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - id: rust-version
        run: echo "version=$(./scripts/pin.sh rust)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: native-candidates-${{ matrix.platform }}
          path: candidate-native
      - uses: actions/download-artifact@v4
        with:
          name: common-model-candidates
          path: candidate-common
      - uses: actions/download-artifact@v4
        with:
          name: node-model-candidates
          path: candidate-node
      - name: Select and verify exact current candidate archives
        id: candidate-artifacts
        env:
          NPM_PLATFORM: ${{ matrix.npm_platform }}
        run: |
          python - <<'PYTHON'
          from email.parser import Parser
          import json
          import os
          from pathlib import Path
          import re
          import tarfile
          import tomllib
          from zipfile import ZipFile

          def exact(directory, filename):
              path = Path(directory) / filename
              if not path.is_file() or path.is_symlink():
                  raise ValueError("Missing exact candidate artifact: " + str(path))
              return path

          def wheel_for(directory, version):
              candidates = [p for p in Path(directory).glob("datafog_core-" + version + "-*.whl") if p.is_file() and not p.is_symlink()]
              if len(candidates) != 1:
                  raise ValueError("Require exactly one wheel for current Python version " + version)
              path = candidates[0]
              with ZipFile(path) as archive:
                  metadata = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
                  if len(metadata) != 1:
                      raise ValueError("Wheel metadata is missing or ambiguous")
                  value = Parser().parsestr(archive.read(metadata[0]).decode("utf-8"))
                  if value["Name"].replace("_", "-").lower() != "datafog-core" or value["Version"] != version:
                      raise ValueError("Wheel filename and metadata disagree")
              return path

          def npm_for(directory, name, version):
              path = exact(directory, name.removeprefix("@").replace("/", "-") + "-" + version + ".tgz")
              with tarfile.open(path, "r:gz") as archive:
                  members = [member for member in archive.getmembers() if member.name == "package/package.json"]
                  if len(members) != 1 or not members[0].isfile():
                      raise ValueError("npm package metadata is missing or ambiguous")
                  value = json.load(archive.extractfile(members[0]))
                  if value["name"] != name or value["version"] != version:
                      raise ValueError("npm filename and metadata disagree")
              return path

          node_version = json.loads(Path("bindings/node/package.json").read_text(encoding="utf-8"))["version"]
          python_version = tomllib.loads(Path("bindings/python/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          core_version = tomllib.loads(Path("crates/core/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", node_version):
              raise ValueError("Invalid candidate package version")
          if node_version != core_version or re.sub(r"^(\d+\.\d+\.\d+)b(\d+)$", r"\1-beta.\2", python_version) != core_version:
              raise ValueError("Core, Node and Python candidate versions disagree")
          crate = exact("candidate-common", "datafog-core-" + core_version + ".crate")
          crate_directory = "datafog-core-" + core_version
          with tarfile.open(crate, "r:gz") as archive:
              metadata = archive.getmembers()
              members = [member for member in metadata if member.name == crate_directory + "/Cargo.toml"]
              if len(members) != 1 or not members[0].isfile():
                  raise ValueError("Rust package metadata missing or ambiguous")
              package = tomllib.loads(archive.extractfile(members[0]).read().decode("utf-8"))["package"]
              if package["name"] != "datafog-core" or package["version"] != core_version:
                  raise ValueError("Rust filename and metadata disagree")
          paths = {"crate": crate, "crate_directory": crate_directory,
                   "wheel": wheel_for("candidate-native", python_version),
                   "node": npm_for("candidate-node", "@datafog/node", node_version),
                   "node_platform": npm_for("candidate-node", "@datafog/node-" + os.environ["NPM_PLATFORM"], node_version)}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in paths.items():
                  output.write(name + "=" + str(value).replace("\\", "/") + "\n")
          PYTHON
      - name: Install build and explicit provisioning tools
        run: python -m pip install 'huggingface_hub==1.27.0' 'psutil==7.2.2'
      - name: Restore pinned model assets
        uses: actions/cache/restore@v4
        id: model-assets
        with:
          path: |
            ${{ runner.temp }}/model-download
            ${{ runner.temp }}/gliner2-download
            ${{ runner.temp }}/gliner2-general-download
          key: model-assets-${{ matrix.backend }}-${{ matrix.backend == 'datafog' && matrix.platform || 'portable-cpu' }}-${{ hashFiles('scripts/provision-datafog-model.py', 'scripts/provision-gliner2-model.py', 'crates/core/src/models/gliner2-lock.json', '.github/workflows/model-datafog.yml') }}
      - name: Download immutable native archive
        if: matrix.backend == 'datafog' && steps.model-assets.outputs.cache-hit != 'true'
        run: |
          hf download DataFog/pii-en-65m \
            "runtimes/v0.2.0/datafog-pii-0.1.0-runtime-0.2.0-$DATAFOG_PLATFORM.tar.gz" \
            --revision 7cadd41e21f59b2a149e31378d073cf6ca057531 --local-dir "$RUNNER_TEMP/model-download"
      - name: Verify and provision separately from inference
        id: verified-datafog
        if: matrix.backend == 'datafog'
        run: |
          python scripts/provision-datafog-model.py \
            --archive "$RUNNER_TEMP/model-download/runtimes/v0.2.0/datafog-pii-0.1.0-runtime-0.2.0-$DATAFOG_PLATFORM.tar.gz" \
            --destination "$RUNNER_TEMP/model-bundle"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          bundle = root / "model-bundle"
          # Explicit CI fixture budgets, not library defaults or performance guarantees.
          config = dict(engine="datafog", bundle=str(bundle), manifest_sha256=hashlib.sha256((bundle / "bundle-manifest.json").read_bytes()).hexdigest(),
                        limits=dict(max_input_bytes=65536, max_response_bytes=1048576, max_findings=1024, timeout_ms=30000, cleanup_timeout_ms=1000))
          (root / "model-session.json").write_text(json.dumps(config))
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"DATAFOG_MODEL_CONFIG={root / 'model-session.json'}\nHF_HUB_OFFLINE=1\n")
          PY
      - name: Download immutable GLiNER2 files
        if: matrix.backend == 'gliner2' && steps.model-assets.outputs.cache-hit != 'true'
        run: |
          hf download fastino/gliner2-privacy-filter-PII-multi \
            config.json encoder_config/config.json tokenizer.json tokenizer_config.json model.safetensors README.md \
            --revision 1cb4166094dc58fa8d836429f060d6c95f62b495 --local-dir "$RUNNER_TEMP/gliner2-download"
      - name: Download immutable general-purpose GLiNER2 files
        if: matrix.backend == 'gliner2-general' && steps.model-assets.outputs.cache-hit != 'true'
        run: |
          hf download fastino/gliner2-base-v1 \
            config.json encoder_config/config.json tokenizer.json tokenizer_config.json \
            added_tokens.json special_tokens_map.json spm.model model.safetensors README.md \
            --revision f9634218e53580c56edf0de97ca1a7d3f1c2354e --local-dir "$RUNNER_TEMP/gliner2-general-download"
      - name: Provision pinned GLiNER2 and isolated local worker
        id: verified-gliner
        if: matrix.backend != 'datafog'
        run: |
          if [[ "$MODEL_BACKEND" == "gliner2-general" ]]; then
            python scripts/provision-gliner2-model.py --source "$RUNNER_TEMP/gliner2-general-download" \
              --model-id fastino/gliner2-base-v1 --revision f9634218e53580c56edf0de97ca1a7d3f1c2354e \
              --destination "$RUNNER_TEMP/model-bundle"
          else
            python scripts/provision-gliner2-model.py --source "$RUNNER_TEMP/gliner2-download" --destination "$RUNNER_TEMP/model-bundle"
          fi
          python -m venv "$RUNNER_TEMP/gliner2-worker"
          python - <<'PYTHON'
          import hashlib, json, os, sys
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          interpreter=root / "gliner2-worker" / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
          bundle=root / "model-bundle"
          labels = ([dict(label="current_employer", description="The organization the person currently works for", threshold=0.5)]
                    if os.environ["MODEL_BACKEND"] == "gliner2-general" else [dict(label="street_address", threshold=0.5)])
          config=dict(engine="gliner2", bundle=str(bundle), manifest_sha256=hashlib.sha256((bundle / "bundle-manifest.json").read_bytes()).hexdigest(),
            gliner2=dict(python=str(interpreter), labels=labels,intra_threads=1,chunk_size=384,chunk_overlap=64),
            limits=dict(max_input_bytes=65536,max_response_bytes=16777216,max_findings=65536,timeout_ms=120000,cleanup_timeout_ms=5000))
          (root / "model-session.json").write_text(json.dumps(config),encoding="utf-8")
          with open(os.environ["GITHUB_ENV"],"a") as stream:
            stream.write(f"WORKER_PYTHON={interpreter}\nDATAFOG_MODEL_CONFIG={root / 'model-session.json'}\nHF_HUB_OFFLINE=1\n")
          PYTHON
      - name: Cache verified pinned assets
        uses: actions/cache/save@v4
        if: steps.model-assets.outputs.cache-hit != 'true' && (steps.verified-datafog.outcome == 'success' || steps.verified-gliner.outcome == 'success')
        with:
          path: |
            ${{ runner.temp }}/model-download
            ${{ runner.temp }}/gliner2-download
            ${{ runner.temp }}/gliner2-general-download
          key: ${{ steps.model-assets.outputs.cache-primary-key }}
      - name: Locate the GLiNER2 worker pip cache
        id: worker-pip
        if: matrix.backend != 'datafog'
        run: echo "dir=$("$WORKER_PYTHON" -m pip cache dir)" >> "$GITHUB_OUTPUT"
      - name: Reuse downloaded GLiNER2 dependencies
        if: matrix.backend != 'datafog'
        uses: actions/cache@v4
        with:
          path: ${{ steps.worker-pip.outputs.dir }}
          # Versions are pinned in pyproject.toml; pip still installs exactly those pins.
          key: gliner2-pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bindings/python/pyproject.toml') }}
      - name: Install optional GLiNER2 dependencies
        if: matrix.backend != 'datafog'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            "$WORKER_PYTHON" -m pip install 'torch==2.12.0' --index-url https://download.pytorch.org/whl/cpu
          fi
          worker_wheel="${{ steps.candidate-artifacts.outputs.wheel }}"
          "$WORKER_PYTHON" -m pip install "${worker_wheel}[gliner2]"
          mkdir -p dist
          "$WORKER_PYTHON" -m pip freeze > dist/worker-environment.txt
      - name: Execute packaged Rust model integration
        run: |
          package_root="$(mktemp -d)"
          tar -xf "${{ steps.candidate-artifacts.outputs.crate }}" -C "$package_root"
          package_manifest="$package_root/${{ steps.candidate-artifacts.outputs.crate_directory }}/Cargo.toml"
          cargo test --manifest-path "$package_manifest" --features models --test model_datafog --release -- --ignored
      - name: Verify installed Python wheel
        run: |
          mkdir -p dist
          python -m pip install --force-reinstall "${{ steps.candidate-artifacts.outputs.wheel }}"
          python -I -X utf8 scripts/model-qualification.py "$DATAFOG_MODEL_CONFIG" dist/model-evidence.json
          python bindings/python/tests/test_installed.py
      - name: Verify final assembled Node artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/model-node-consumer"
          package="${{ steps.candidate-artifacts.outputs.node }}"
          platform_package="${{ steps.candidate-artifacts.outputs.node_platform }}"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/model-node-consumer" "$GITHUB_WORKSPACE/$package" "$GITHUB_WORKSPACE/$platform_package"
          node scripts/model-node-conformance.mjs "$DATAFOG_MODEL_CONFIG" dist/model-evidence.json "$RUNNER_TEMP/model-node-consumer/node_modules/@datafog/node/index.js"
          UV_THREADPOOL_SIZE=1 node scripts/model-node-scheduling.mjs "$DATAFOG_MODEL_CONFIG" "$RUNNER_TEMP/model-node-consumer/node_modules/@datafog/node/index.js"
          node scripts/test-node-package.mjs --prebuilt --tarball "$package" --platform-tarball "$platform_package"
      - name: Qualify actual worker faults and cancellation
        run: python -I -X utf8 scripts/model-fault-conformance.py "$DATAFOG_MODEL_CONFIG"
      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.backend }}-${{ matrix.platform }}
          path: dist/
