name: Windows Node shutdown diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.2", "25.8.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 56f4d311737e2a245cdbd01ed11e54c3e87bb4dd
          path: baseline-source
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose exact candidate and public baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose-windows-node-shutdown.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-node-shutdown-${{ matrix.node }}
          path: shutdown-diagnosis
          if-no-files-found: error
