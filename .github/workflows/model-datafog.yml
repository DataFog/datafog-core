name: Compare final Node shutdown workload
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 60a009832271f4240f44895a30cbce6eb3585c2d
          path: candidate-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Build exact copied-buffer binding
        run: |
          npm ci --prefix candidate-source/bindings/node
          npm run build --prefix candidate-source/bindings/node
      - name: Compare shared final conformance workload
        run: python scripts/compare-node-output-shutdown.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-output-final-workload-comparison
          path: output-comparison
          if-no-files-found: error
