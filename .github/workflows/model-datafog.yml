name: Model qualification

# Model assets are explicit qualification inputs, never default workspace tests.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/core/src/models/**"
      - "crates/core/src/models.rs"
      - "bindings/**"
      - "scripts/*model*"
      - "workers/gliner2/**"
      - ".github/workflows/model-datafog.yml"
      - ".github/workflows/model-candidates.yml"

permissions:
  contents: read

jobs:
  candidates:
    uses: ./.github/workflows/model-candidates.yml
  installed-model:
    needs: candidates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        backend: [datafog, gliner2]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            npm_platform: linux-x64-gnu
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            npm_platform: linux-arm64-gnu
          - os: macos-14
            platform: macos-arm64
            npm_platform: darwin-arm64
          - os: macos-15-intel
            platform: macos-x86_64
            npm_platform: darwin-x64
          - os: windows-latest
            platform: windows-x86_64
            npm_platform: win32-x64-msvc
    defaults:
      run:
        shell: bash
    env:
      DATAFOG_PLATFORM: ${{ matrix.platform }}
      MODEL_BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: native-candidates-${{ matrix.platform }}
          path: candidate-native
      - uses: actions/download-artifact@v4
        with:
          name: common-model-candidates
          path: candidate-common
      - uses: actions/download-artifact@v4
        with:
          name: node-model-candidates
          path: candidate-node
      - name: Install build and explicit provisioning tools
        run: python -m pip install 'maturin>=1.9.4,<2.0' 'huggingface_hub==1.27.0' 'psutil==7.2.2' 'build==1.4.0'
      - name: Download immutable native archive
        if: matrix.backend == 'datafog'
        run: |
          hf download DataFog/pii-en-65m \
            "runtimes/v0.2.0/datafog-pii-0.1.0-runtime-0.2.0-$DATAFOG_PLATFORM.tar.gz" \
            --revision 7cadd41e21f59b2a149e31378d073cf6ca057531 --local-dir "$RUNNER_TEMP/model-download"
      - name: Verify and provision separately from inference
        if: matrix.backend == 'datafog'
        run: |
          python scripts/provision-datafog-model.py \
            --archive "$RUNNER_TEMP/model-download/runtimes/v0.2.0/datafog-pii-0.1.0-runtime-0.2.0-$DATAFOG_PLATFORM.tar.gz" \
            --destination "$RUNNER_TEMP/model-bundle"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          bundle = root / "model-bundle"
          # Explicit CI fixture budgets, not library defaults or performance guarantees.
          config = dict(bundle=str(bundle), manifest_sha256=hashlib.sha256((bundle / "bundle-manifest.json").read_bytes()).hexdigest(),
                        limits=dict(max_input_bytes=65536, max_response_bytes=1048576, max_findings=1024, timeout_ms=30000, cleanup_timeout_ms=1000))
          (root / "model-session.json").write_text(json.dumps(config))
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"DATAFOG_MODEL_CONFIG={root / 'model-session.json'}\nHF_HUB_OFFLINE=1\n")
          PY
      - name: Provision pinned GLiNER2 and isolated local worker
        if: matrix.backend == 'gliner2'
        run: |
          hf download fastino/gliner2-privacy-filter-PII-multi \
            config.json encoder_config/config.json tokenizer.json tokenizer_config.json model.safetensors README.md \
            --revision 1cb4166094dc58fa8d836429f060d6c95f62b495 --local-dir "$RUNNER_TEMP/gliner2-download"
          python scripts/provision-gliner2-model.py --source "$RUNNER_TEMP/gliner2-download" --destination "$RUNNER_TEMP/model-bundle"
          python -m venv "$RUNNER_TEMP/gliner2-worker"
          python - <<'PYTHON'
          import hashlib, json, os, sys
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          interpreter=root / "gliner2-worker" / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
          bundle=root / "model-bundle"
          config=dict(bundle=str(bundle), manifest_sha256=hashlib.sha256((bundle / "bundle-manifest.json").read_bytes()).hexdigest(),
            gliner2=dict(python=str(interpreter), labels=[dict(label="street_address",threshold=0.5)],intra_threads=1,chunk_size=384,chunk_overlap=64),
            limits=dict(max_input_bytes=65536,max_response_bytes=16777216,max_findings=65536,timeout_ms=120000,cleanup_timeout_ms=5000))
          (root / "model-session.json").write_text(json.dumps(config),encoding="utf-8")
          with open(os.environ["GITHUB_ENV"],"a") as stream:
            stream.write(f"WORKER_PYTHON={interpreter}\nDATAFOG_MODEL_CONFIG={root / 'model-session.json'}\nHF_HUB_OFFLINE=1\n")
          PYTHON
      - name: Install qualified CPU worker dependencies
        if: matrix.backend == 'gliner2'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            "$WORKER_PYTHON" -m pip install 'torch==2.12.0' --index-url https://download.pytorch.org/whl/cpu
          fi
          "$WORKER_PYTHON" -m pip install candidate-common/datafog_gliner2_worker-*.whl
          mkdir -p dist
          "$WORKER_PYTHON" -m pip freeze > dist/worker-environment.txt
      - name: Verify GLiNER2 offline runtime prerequisites
        if: matrix.backend == 'gliner2'
        run: |
          "$WORKER_PYTHON" -I -c 'import torch, gliner2; print("PyTorch", torch.__version__, "GLiNER2", gliner2.__version__)'
          "$WORKER_PYTHON" -I -c 'import os; from gliner2 import GLiNER2; GLiNER2.from_pretrained(os.path.join(os.environ["RUNNER_TEMP"], "model-bundle"), local_files_only=True, map_location="cpu"); print("Pinned local checkpoint loaded offline")'
      - name: Execute packaged Rust model integration
        run: |
          mkdir -p "$RUNNER_TEMP/packaged-core"
          tar -xf candidate-common/datafog-core-*.crate -C "$RUNNER_TEMP/packaged-core"
          package_manifest="$(find "$RUNNER_TEMP/packaged-core" -name Cargo.toml -maxdepth 2 | head -1)"
          cargo test --manifest-path "$package_manifest" --features models --test model_datafog --release -- --ignored
      - name: Build and verify installed Python wheel
        run: |
          mkdir -p dist
          python -m pip install --force-reinstall candidate-native/*.whl
          if [[ "$MODEL_BACKEND" == "datafog" ]]; then
            python -I bindings/python/tests/model_conformance.py "$DATAFOG_MODEL_CONFIG"
          fi
          python -I scripts/model-qualification.py "$DATAFOG_MODEL_CONFIG" dist/model-evidence.json --warm-runs 100
          python bindings/python/tests/test_installed.py
      - name: Verify final assembled Node artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/model-node-consumer"
          package="$(find candidate-node -maxdepth 1 -name 'datafog-node-0*.tgz')"
          platform_package="$(find candidate-node -maxdepth 1 -name 'datafog-node-${{ matrix.npm_platform }}-*.tgz')"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/model-node-consumer" "$GITHUB_WORKSPACE/$package" "$GITHUB_WORKSPACE/$platform_package"
          if [[ "$MODEL_BACKEND" == "datafog" ]]; then
            node scripts/model-node-conformance.mjs "$DATAFOG_MODEL_CONFIG" "$RUNNER_TEMP/model-node-consumer/node_modules/@datafog/node/index.js"
          else
            node scripts/model-gliner2-node-conformance.mjs "$DATAFOG_MODEL_CONFIG" dist/model-evidence.json "$RUNNER_TEMP/model-node-consumer/node_modules/@datafog/node/index.js"
          fi
          node scripts/test-node-package.mjs --prebuilt --tarball "$package" --platform-tarball "$platform_package"
      - name: Verify pre-provisioned container without network
        if: matrix.backend == 'gliner2' && startsWith(matrix.platform, 'linux-')
        run: |
          context="$RUNNER_TEMP/offline-model-context"
          mkdir -p "$context/wheels"
          "$WORKER_PYTHON" -m pip download --only-binary=:all: --dest "$context/wheels" \
            --extra-index-url https://download.pytorch.org/whl/cpu -r dist/worker-environment.txt
          cp candidate-native/*.whl "$context/wheels/"
          cp -R "$RUNNER_TEMP/model-bundle" "$context/bundle"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          config=json.loads((root / "model-session.json").read_text())
          config["bundle"]="/opt/datafog/bundle"
          config["gliner2"]["python"]="/usr/local/bin/python"
          (root / "offline-model-context/session.json").write_text(json.dumps(config))
          PYTHON
          docker pull python:3.12-slim
          image="$(docker inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          printf '%s\n' "$image" > dist/container-base-image.txt
          docker build --network=none --build-arg "PYTHON_IMAGE=$image" \
            -f examples/model-offline/Dockerfile -t datafog-model-beta "$context"
          docker run --rm --network=none datafog-model-beta > dist/offline-container.txt
      - name: Record exact backend identity and host
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          from datafog_core import ModelSession
          with ModelSession.open(json.load(open(os.environ["DATAFOG_MODEL_CONFIG"]))) as session:
              report = {"host": platform.platform(), "python": platform.python_version(), "session": session.inspect(),
                        "candidate_sha256": {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                            for folder in ("candidate-native", "candidate-common", "candidate-node")
                            for p in Path(folder).glob("*") if p.is_file()}}
          with open("dist/model-identity.json", "w") as stream:
              json.dump(report, stream, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.backend }}-${{ matrix.platform }}
          path: dist/
