name: Windows Node output before-after
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 725b0dd490ad085c676b50922721a7d6d0d7b565
          path: candidate-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Build exact reviewed fixed binding
        run: |
          npm ci --prefix candidate-source/bindings/node
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned Node build tools' }
          npm run build --prefix candidate-source/bindings/node -- --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build reviewed fixed source' }
      - name: Compare fixed counts against the original exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/compare-node-output-shutdown.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-output-before-after
          path: |
            output-comparison/*.json
            output-comparison/*.stdout
            output-comparison/*.stderr
            output-comparison/fixed/*.tgz
          if-no-files-found: error
