name: Windows Node shutdown diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.2", "25.8.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 56f4d311737e2a245cdbd01ed11e54c3e87bb4dd
          path: baseline-source
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate and verify native crash capture tools
        shell: pwsh
        run: |
          Get-Command cdb,procdump64 -ErrorAction SilentlyContinue | Select-Object Name,Source
          Test-Path 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip procdump
          $exe = (Resolve-Path procdump/procdump64.exe).Path
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Untrusted ProcDump binary' }
          Get-FileHash $exe -Algorithm SHA256
          "DIAGNOSE_PROCDUMP=$exe" >> $env:GITHUB_ENV
      - name: Diagnose exact candidate and public baseline
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSE_MODES: ""
          DIAGNOSE_SKIP_FULL: "1"
          DIAGNOSE_FULL_CONSUMER_REPEATS: "50"
          DIAGNOSE_CAPTURE_REPEATS: "50"
        run: python scripts/diagnose-windows-node-shutdown.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-node-shutdown-${{ matrix.node }}
          path: shutdown-diagnosis
          if-no-files-found: error
