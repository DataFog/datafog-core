name: Publish Python package

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  build-wheels:
    name: Build ${{ matrix.target }} wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            smoke_platform: linux/amd64
            smoke_image: python:3.12-slim-bookworm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            smoke_platform: linux/arm64
            smoke_image: python:3.12-slim-bookworm
          # musllinux: Alpine and other musl images. Without these, pip falls
          # back to the sdist and needs a Rust toolchain.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke_platform: linux/amd64
            smoke_image: python:3.12-alpine
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke_platform: linux/arm64
            smoke_image: python:3.12-alpine
          # Non-x86 server platforms, cross-compiled through manylinux images.
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            manylinux: "2_28"
            smoke_platform: linux/s390x
            # The official Python slim manifest does not include s390x.
            smoke_image: quay.io/pypa/manylinux_2_28_s390x@sha256:a65b6b9997e71847fc062067c4a7de9733d1dd9b83abcead084fdad0e3abc0b7
            smoke_python: /opt/python/cp312-cp312/bin/python
            emulated: true
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            manylinux: "2_28"
            smoke_platform: linux/ppc64le
            smoke_image: python:3.12-slim-bookworm
            emulated: true
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check-release.py python
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --manifest-path bindings/python/Cargo.toml --out dist
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.emulated
        with:
          platforms: s390x,ppc64le
      - name: Install and smoke native wheel
        if: runner.os != 'Linux'
        run: python scripts/check-python-distributions.py dist --smoke
      - name: Install and smoke Linux wheel on target architecture and libc
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --platform "${{ matrix.smoke_platform }}"
          -v "${{ github.workspace }}:/io" -w /io "${{ matrix.smoke_image }}"
          "${{ matrix.smoke_python || 'python' }}" scripts/check-python-distributions.py dist --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check-release.py python
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --manifest-path bindings/python/Cargo.toml --out dist
      - name: Validate source notices and pinned toolchain
        run: python scripts/check-python-distributions.py dist
      - name: Exercise distribution validation failures
        run: python scripts/test-python-distributions.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-distribution
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require exact-commit Core and FogVault qualification for v1+
        run: python3 scripts/check-fogvault-release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require passing model integration for this commit
        run: python3 scripts/check-model-integration.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate the complete candidate distribution set
        run: python scripts/check-python-distributions.py dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          packages-dir: dist
          skip-existing: false
