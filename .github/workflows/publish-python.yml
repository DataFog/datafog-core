name: Publish Python package
on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify retained qualified artifacts without publishing
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release.py python
      - name: Require complete model qualification for this source
        id: qualified
        run: python3 scripts/check-model-qualification.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-candidates-*
          run-id: ${{ steps.qualified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate/native
      - uses: actions/download-artifact@v4
        with:
          name: common-model-candidates
          run-id: ${{ steps.qualified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate/common
      - name: Select qualified Python distributions
        run: |
          mkdir -p dist
          find candidate -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          sha256sum dist/*
      - run: python3 scripts/verify-python-candidates.py dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          packages-dir: dist
          skip-existing: true
