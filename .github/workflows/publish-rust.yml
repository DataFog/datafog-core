name: Publish Rust crate
on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify retained qualified artifacts without publishing
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release.py rust
      - name: Require complete model qualification for this source
        id: qualified
        run: python3 scripts/check-model-qualification.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: common-model-candidates
          run-id: ${{ steps.qualified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Extract qualified crate source
        run: |
          mkdir -p packaged
          tar -xf candidate/datafog-core-*.crate -C packaged
      - name: Verify publication from the qualified source
        run: cargo publish --manifest-path packaged/datafog-core-*/Cargo.toml --locked --dry-run
      - name: Publish qualified source
        if: github.event_name == 'push' || !inputs.dry_run
        run: cargo publish --manifest-path packaged/datafog-core-*/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
