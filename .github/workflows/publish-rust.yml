name: Publish Rust crate

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish datafog-core to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: Require complete model qualification for this source
        run: python3 scripts/check-model-qualification.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 scripts/check-release.py rust
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --package datafog-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
