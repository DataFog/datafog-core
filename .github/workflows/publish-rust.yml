name: Publish Rust crate

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish datafog-core to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: Require passing model integration for this commit
        run: python3 scripts/check-model-integration.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 scripts/check-release.py rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml
      - run: cargo publish --package datafog-core --locked --dry-run
      - run: cargo publish --package datafog-core --locked
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
