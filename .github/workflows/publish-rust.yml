name: Publish Rust crate

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish datafog-core to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: Require exact-commit Core and FogVault qualification for v1+
        run: python3 scripts/check-fogvault-release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require passing model integration for this commit
        run: python3 scripts/check-model-integration.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 scripts/check-release.py rust
      - id: rust-version
        run: echo "version=$(./scripts/pin.sh rust)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy
      - run: cargo publish --package datafog-core --locked --dry-run
      - name: Retain the exact Cargo upload input
        run: python3 scripts/stage-publication.py rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-publication-inputs
          path: target/publication-rust/
          if-no-files-found: error
      - run: cargo publish --package datafog-core --locked
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
