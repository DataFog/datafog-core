[package]
name = "datafog-fogvault-node"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
datafog-fogvault-native = { version = "1.0.0", path = "../fogvault-native" }
datafog-fogvault-migration = { version = "1.0.0", path = "../fogvault-migration" }
datafog-core = { version = "1.0.0", path = "../../crates/core", default-features = false }
napi = { version = "=3.12.2", features = ["serde-json"] }
napi-derive = "=3.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.1"

[build-dependencies]
napi-build = "=2.4.1"
# Match Core lock: newer backend moved its syn ABI beyond napi-derive3.6.3.
napi-derive-backend = "=6.1.2"

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
