[package]
name = "datafog-fogvault-native"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Optional native persistence integration for DataFog Core workspaces"
readme = "README.md"

[workspace]

[dependencies]
datafog-fogvault-migration = { version = "1.0.0", path = "../fogvault-migration" }
datafog-core = { version = "1.0.0", path = "../../crates/core", default-features = false }
fogvault-native = { version = "0.1.0", git = "https://github.com/DataFog/fogvault.git", rev = "220aaec145fe67f4c96d468d6858445020b88cd3", default-features = false }
zeroize = "=1.9.1"

[dev-dependencies]
published-beta3 = { package = "datafog-core", version = "=0.5.0-beta.3", default-features = false }
serde_json = "1"
getrandom = "=0.4.3"
tempfile = "3"

[profile.test]
opt-level = 2
