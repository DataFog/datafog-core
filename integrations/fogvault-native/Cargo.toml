[package]
name = "datafog-fogvault-native"
version = "1.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Optional native persistence integration for DataFog Core workspaces"
readme = "README.md"

[workspace]

[dependencies]
datafog-fogvault-migration = { version = "=1.5.0", path = "../fogvault-migration" }
datafog-core = { version = "=1.5.0", path = "../../crates/core", default-features = false }
fogvault-native = { version = "0.1.0", git = "https://github.com/DataFog/fogvault.git", rev = "f4dc492549b70f0bc44f5c6bf82fe3022353030f", default-features = false }
zeroize = "=1.9.1"
chacha20poly1305 = "=0.11.0"
fs2 = "=0.4.3"
getrandom = "=0.4.3"
tempfile = "3"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
published-beta3 = { package = "datafog-core", version = "=0.5.0-beta.3", default-features = false }
serde_json = "1"
getrandom = "=0.4.3"
tempfile = "3"

[profile.test]
opt-level = 2
