[package]
name = "datafog-fogvault-python"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace]

[lib]
name = "datafog_fogvault"
crate-type = ["cdylib"]

[dependencies]
datafog-fogvault-native = { path = "../fogvault-native" }
datafog-fogvault-migration = { path = "../fogvault-migration" }
datafog-core = { path = "../../crates/core", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[profile.dev]
debug = 0

[profile.release]
debug = 0
