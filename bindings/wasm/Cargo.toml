[package]
name = "datafog-wasm"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings for datafog-core"
license = "MIT"
repository = "https://github.com/DataFog/datafog-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
datafog-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
