[package]
name = "datafog-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Node.js bindings for datafog-core"
license = "MIT"
repository = "https://github.com/DataFog/datafog-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
datafog-core = { path = "../../crates/core" }
napi = { version = "=3.12.2", features = ["serde-json"] }
napi-derive = "=3.6.3"
serde_json = "1"

[build-dependencies]
napi-build = "=2.4.1"
