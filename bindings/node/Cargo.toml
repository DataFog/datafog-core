[package]
name = "datafog-node"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Node.js bindings for datafog-core"
license = "MIT"
repository = "https://github.com/DataFog/datafog-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
datafog-core = { version = "1.0.0", path = "../../crates/core", features = ["models"] }
napi = { version = "=3.12.2", features = ["serde-json"] }
napi-derive = "=3.6.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
napi-build = "=2.4.1"
