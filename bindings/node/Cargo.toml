[package]
name = "datafog-node"
version = "0.1.0"
edition = "2024"
description = "Node.js bindings for datafog-core"
license = "MIT"
repository = "https://github.com/DataFog/datafog-core"

[lib]
crate-type = ["cdylib"]

[dependencies]
datafog-core = { path = "../../crates/core" }
napi = "=3.12.2"
napi-derive = "=3.6.3"

[build-dependencies]
napi-build = "=2.4.1"
