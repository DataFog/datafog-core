[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "datafog-core"
version = "0.2.0"
description = "Fast structured PII detection implemented in Rust"
readme = "../../README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DataFog" }]
keywords = ["pii", "privacy", "detection", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/DataFog/datafog-core"
Repository = "https://github.com/DataFog/datafog-core"
Issues = "https://github.com/DataFog/datafog-core/issues"

[tool.maturin]
module-name = "datafog_core"
