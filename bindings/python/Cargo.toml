[package]
name = "datafog-core-python"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for datafog-core"
license = "MIT"
repository = "https://github.com/DataFog/datafog-core"

[lib]
name = "datafog_core"
crate-type = ["cdylib"]

[dependencies]
datafog-core = { version = "1.0.0", path = "../../crates/core", features = ["models"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
serde_json = "1"
serde = "1"
# Reuse Core's wipe primitive for transient copied UTF-16 transport buffers.
zeroize = "1"
