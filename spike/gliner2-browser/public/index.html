<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GLiNER2.5 Small — browser scan</title>
  <style>
    body {
      max-width: 850px;
      margin: 3rem auto;
      padding: 0 1rem;
      font: 16px/1.5 system-ui;
      color: #162536;
    }
    textarea,
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 0.7rem;
      font: inherit;
    }
    textarea {
      min-height: 160px;
    }
    label {
      display: block;
      margin: 1rem 0 0.3rem;
      font-weight: 600;
    }
    button {
      margin: 1rem 0;
      padding: 0.6rem 1rem;
      font: inherit;
      cursor: pointer;
    }
    td,
    th {
      padding: 0.5rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    pre {
      padding: 1rem;
      background: #f3f5f7;
      overflow: auto;
    }
    #status[role="alert"] {
      color: #a00020;
    }
  </style>
  <h1>PII scan</h1>
  <p>
    GLiNER2.5 Small runs locally in your browser. Choose the entity types to
    scan. Rules detect structured PII; Small detects the other requested types.
  </p>
  <p id="status" role="status">Ready to load the model (about 297 MB).</p>
  <button id="load">Load model</button>
  <label for="text">Text</label>
  <textarea id="text">
Contact John Smith at john.smith@example.com or call +1 (415) 555-0123. He lives at 123 Main Street, San Francisco, CA 94105. His username is jsmith.</textarea
  >
  <label for="labels">Entity types, separated by commas</label>
  <input id="labels" />
  <button id="extract" disabled>Scan text</button>
  <table hidden id="entities">
    <thead>
      <tr>
        <th>Type</th>
        <th>Text</th>
        <th>Raw model score</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <pre id="json" hidden></pre>
  <script type="importmap">
    {
      "imports": {
        "@datafog/wasm": "/sdk/index.js",
        "@datafog/wasm/models": "/sdk/models/index.js",
        "onnxruntime-web/wasm": "/node_modules/onnxruntime-web/dist/ort.wasm.min.mjs",
        "@huggingface/tokenizers": "/node_modules/@huggingface/tokenizers/dist/tokenizers.mjs"
      }
    }
  </script>
  <script type="module">
    import { ModelSession } from "@datafog/wasm/models";
    const $ = (id) => document.getElementById(id);
    $("labels").value =
      "PERSON, ADDRESS, EMAIL, PHONE, IDENTIFICATION_NUMBER, URL, USERNAME";
    let session;
    function status(text, error = false) {
      $("status").textContent = text;
      $("status").setAttribute("role", error ? "alert" : "status");
    }
    $("load").onclick = async () => {
      $("load").disabled = true;
      status("Loading GLiNER2.5 Small…");
      try {
        session = await ModelSession.open({
          modelBaseUrl: new URL("/models/", location.href),
          wasmPaths: new URL(
            "/node_modules/onnxruntime-web/dist/",
            location.href,
          ).href,
        });
        $("extract").disabled = false;
        status("Model ready.");
      } catch (error) {
        status(error.message, true);
        $("load").disabled = false;
      }
    };
    $("extract").onclick = async () => {
      $("extract").disabled = true;
      $("entities").hidden = true;
      $("json").hidden = true;
      try {
        const result = await session.scan($("text").value, {
          entities: $("labels")
            .value.split(",")
            .map((label) => label.trim()),
        });
        const body = $("entities").querySelector("tbody");
        body.replaceChildren();
        for (const [index, entity] of result.findings.entries()) {
          const row = document.createElement("tr");
          for (const value of [
            entity.entityType,
            entity.matchedText,
            result.evidence[index].sources
              .find((source) => source.raw_score)
              ?.raw_score.value.toFixed(3) ?? "—",
          ]) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.append(cell);
          }
          body.append(row);
        }
        $("entities").hidden = false;
        $("json").textContent = JSON.stringify(result, null, 2);
        $("json").hidden = false;
        status(`${result.findings.length} entities detected.`);
      } catch (error) {
        status(error.message, true);
      } finally {
        $("extract").disabled = false;
      }
    };
  </script>
</html>
