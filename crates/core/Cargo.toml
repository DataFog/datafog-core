[package]
name = "datafog-core"
version = "0.5.0-beta.2"
edition = "2024"
rust-version = "1.88"
description = "Fast structured PII detection library"
license = "MIT"
homepage = "https://datafog.ai"
repository = "https://github.com/DataFog/datafog-core"
readme = "../../README.md"
keywords = ["pii", "privacy", "detection"]
categories = ["text-processing"]

[features]
default = []
models = []

[dependencies]
base64 = "0.22"
hmac = "0.12"
minicbor = { version = "=2.3.0", features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
futures = "0.3"
sha2 = "0.10"
